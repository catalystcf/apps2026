<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A simple, welcoming starting point for your next idea."
    />
    <meta name="theme-color" content="#f5f7f2" />
    <title>Open Space</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #18322b;
        background: #f5f7f2;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
      }

      a {
        color: inherit;
      }

      .app-shell {
        display: flex;
        min-height: 100vh;
        min-height: 100svh;
        flex-direction: column;
        padding: max(1.25rem, env(safe-area-inset-top))
          max(1.25rem, env(safe-area-inset-right))
          max(1.25rem, env(safe-area-inset-bottom))
          max(1.25rem, env(safe-area-inset-left));
      }

      .site-header,
      .site-footer {
        width: min(100%, 68rem);
        margin-inline: auto;
      }

      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        font-size: 1rem;
        font-weight: 750;
        letter-spacing: -0.03em;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 2rem;
        aspect-ratio: 1;
        place-items: center;
        border-radius: 0.7rem;
        background: #d9e9dc;
        color: #246348;
        font-size: 1.1rem;
      }

      .header-link {
        padding: 0.55rem 0.85rem;
        border: 1px solid #dce4da;
        border-radius: 999px;
        color: #425c51;
        font-size: 0.875rem;
        text-decoration: none;
      }

      .header-link:focus-visible,
      .brand:focus-visible {
        outline: 3px solid #78a889;
        outline-offset: 4px;
      }

      .page-content {
        display: grid;
        width: min(100%, 68rem);
        flex: 1;
        align-items: center;
        margin: 0 auto;
        padding-block: clamp(3rem, 9vh, 7rem);
      }

      .welcome-card {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(15rem, 0.9fr);
        align-items: center;
        gap: clamp(2rem, 7vw, 6rem);
        padding: clamp(1.5rem, 6vw, 5rem);
        border: 1px solid #e5ebe2;
        border-radius: 2rem;
        background: #fff;
        box-shadow: 0 1.5rem 5rem rgb(38 66 49 / 7%);
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: #397657;
        font-size: 0.75rem;
        font-weight: 750;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 11ch;
        margin: 0;
        font-size: clamp(2.75rem, 7vw, 5.5rem);
        font-weight: 650;
        letter-spacing: -0.075em;
        line-height: 0.98;
      }

      .intro {
        max-width: 34rem;
        margin: 1.5rem 0 0;
        color: #61736b;
        font-size: clamp(1rem, 2vw, 1.125rem);
        line-height: 1.7;
      }

      .welcome-art {
        display: grid;
        min-height: 17rem;
        place-items: center;
        overflow: hidden;
        border-radius: 1.5rem;
        background:
          radial-gradient(ellipse at 50% 110%, #a8cdb0 0 23%, transparent 24%),
          radial-gradient(ellipse at 50% 120%, #cbe1c8 0 41%, transparent 42%),
          linear-gradient(150deg, #e8f1e6, #f4f5e9 72%);
      }

      .sun {
        display: grid;
        width: clamp(6rem, 16vw, 9rem);
        aspect-ratio: 1;
        place-items: center;
        border-radius: 50%;
        background: #f5d895;
        box-shadow: 0 0 4rem rgb(245 216 149 / 60%);
        color: #825d25;
        font-size: 2rem;
      }

      .site-footer {
        padding-top: 1rem;
        color: #748179;
        font-size: 0.8125rem;
        text-align: center;
      }

      @media (max-width: 640px) {
        .app-shell {
          padding-inline: max(1rem, env(safe-area-inset-left));
          padding-right: max(1rem, env(safe-area-inset-right));
        }

        .page-content {
          padding-block: 2rem;
        }

        .welcome-card {
          grid-template-columns: 1fr;
          gap: 2rem;
          padding: clamp(1.5rem, 8vw, 2.5rem);
          border-radius: 1.5rem;
        }

        .welcome-art {
          min-height: 12rem;
          border-radius: 1.1rem;
        }
      }
    </style>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <noscript
      >This page needs JavaScript enabled to display its content.</noscript
    >
  </body>
</html>
