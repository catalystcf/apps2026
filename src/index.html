<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A phone-friendly math worksheet with a virtual number keyboard."
    />
    <meta name="theme-color" content="#f4f6f8" />
    <title>Math Worksheet</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #1e293b;
        background: #f4f6f8;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
      }

      .app-shell {
        display: flex;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        flex-direction: column;
        overflow: hidden;
        padding: max(0.75rem, env(safe-area-inset-top))
          max(0.75rem, env(safe-area-inset-right))
          max(0.75rem, env(safe-area-inset-bottom))
          max(0.75rem, env(safe-area-inset-left));
      }

      .app-header {
        display: flex;
        min-height: 3.25rem;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding-inline: 0.25rem;
      }

      .app-title {
        margin: 0;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: -0.025em;
      }

      .app-status {
        color: #64748b;
        font-size: 0.8125rem;
      }

      .workspace {
        display: flex;
        width: min(100%, 76rem);
        flex: 1;
        flex-direction: column;
        min-height: 0;
        gap: 0.625rem;
        align-self: center;
        padding-top: 0.75rem;
      }

      .worksheet-panel,
      .keyboard-panel {
        min-width: 0;
        overflow: hidden;
        border: 1px solid #e1e7ed;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 0.5rem 1.5rem rgb(31 41 55 / 5%);
      }

      .worksheet-panel {
        display: flex;
        flex: 1;
        flex-direction: column;
        padding: clamp(1rem, 3vw, 1.5rem);
      }

      .panel-heading {
        margin: 0;
        font-size: 0.9375rem;
        font-weight: 650;
      }

      .worksheet-paper {
        display: grid;
        flex: 1;
        min-height: 0;
        place-items: center;
        margin-top: 1rem;
        border: 1px dashed #d6dee7;
        border-radius: 0.75rem;
        background-color: #fbfcfd;
        background-image: linear-gradient(#eef2f6 1px, transparent 1px);
        background-size: 100% 2.5rem;
        color: #8a98a9;
        font-size: 0.875rem;
        text-align: center;
      }

      .keyboard-panel {
        display: flex;
        width: 100%;
        flex: 0 0 auto;
        flex-direction: column;
        padding: clamp(0.75rem, 2vw, 1.25rem);
      }

      .keyboard-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.5rem;
      }

      .keyboard-hint {
        color: #8995a4;
        font-size: 0.75rem;
      }

      .keypad {
        display: grid;
        flex: none;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-template-rows: repeat(4, clamp(2.75rem, 7.5dvh, 3.75rem));
        gap: clamp(0.4rem, 1.2vw, 0.7rem);
        padding-top: 1rem;
      }

      .key {
        display: grid;
        min-width: 0;
        place-items: center;
        border: 1px solid #e1e7ed;
        border-radius: 0.75rem;
        background: #f8fafc;
        color: #263548;
        font-size: clamp(1.125rem, 3vw, 1.5rem);
        font-weight: 550;
        user-select: none;
      }

      .key--operator {
        border-color: #d8e6df;
        background: #eff6f2;
        color: #276447;
      }

      .key--equals {
        border-color: #286646;
        background: #286646;
        color: #fff;
      }

      .key--zero {
        grid-column: span 2;
      }

      @media (max-width: 640px) {
        .app-shell {
          padding: max(0.5rem, env(safe-area-inset-top))
            max(0.5rem, env(safe-area-inset-right))
            max(0.5rem, env(safe-area-inset-bottom))
            max(0.5rem, env(safe-area-inset-left));
        }

        .app-header {
          min-height: 2.75rem;
        }

        .workspace {
          padding-top: 0.5rem;
        }

        .worksheet-panel {
          flex: 1;
          padding: 0.875rem;
        }

        .worksheet-paper {
          margin-top: 0.75rem;
          background-size: 100% 2rem;
        }

        .keyboard-panel {
          padding: 0.75rem;
        }

        .keypad {
          gap: 0.4rem;
          padding-top: 0.65rem;
        }
      }

      @media (max-width: 360px) {
        .app-status,
        .keyboard-hint {
          font-size: 0.6875rem;
        }

        .keypad {
          gap: 0.3rem;
        }
      }
    </style>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <noscript>
      This worksheet needs JavaScript enabled to display its layout.
    </noscript>
  </body>
</html>
