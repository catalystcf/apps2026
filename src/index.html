<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A phone-friendly math worksheet with a virtual number keyboard."
    />
    <meta name="theme-color" content="#f4f6f8" />
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #1e293b;
        background: #f4f6f8;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
      }

      .app-shell {
        display: flex;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        flex-direction: column;
        overflow: hidden;
        padding: max(0.75rem, env(safe-area-inset-top))
          max(0.75rem, env(safe-area-inset-right))
          max(0.75rem, env(safe-area-inset-bottom))
          max(0.75rem, env(safe-area-inset-left));
      }

      .app-header {
        display: flex;
        min-height: 3.25rem;
        align-items: center;
        justify-content: flex-start;
        gap: 1rem;
        padding-inline: 0.25rem;
      }

      .app-title {
        margin: 0;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: -0.025em;
      }

      .app-title-group {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .math-options {
        position: relative;
        display: flex;
        align-items: center;
        gap: 0.25rem;
      }

      .math-options-toggle {
        display: inline-flex;
        width: 1.75rem;
        height: 1.75rem;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 1px solid #e1e7ed;
        border-radius: 0.5rem;
        background: #fff;
        color: #263548;
        font: inherit;
        font-size: 0.8125rem;
        cursor: pointer;
      }

      .math-options-selected {
        display: flex;
        align-items: center;
        gap: 0.25rem;
      }

      .math-options-selected[hidden] {
        display: none;
      }

      .math-options-selected button {
        display: grid;
        width: 1.75rem;
        height: 1.75rem;
        place-items: center;
        padding: 0;
        border: 1px solid #dc2626;
        border-radius: 0.5rem;
        background: #fff7f7;
        color: #263548;
        font: inherit;
        cursor: pointer;
      }

      .math-options-caret {
        color: #64748b;
        font-size: 0.75rem;
      }

      .math-options-list {
        position: absolute;
        z-index: 10;
        top: calc(100% + 0.25rem);
        left: 0;
        display: flex;
        flex-direction: column;
        gap: 0.375rem;
        padding: 0.375rem;
        border: 1px solid #e1e7ed;
        border-radius: 0.75rem;
        background: #fff;
        box-shadow: 0 0.5rem 1.5rem rgb(31 41 55 / 12%);
      }

      .math-options-list[hidden] {
        display: none;
      }

      .math-option {
        position: relative;
        display: grid;
        width: 2.75rem;
        height: 2.75rem;
        place-items: center;
        border: 1px solid #e1e7ed;
        border-radius: 0.5rem;
        background: #f8fafc;
        color: #263548;
        font: inherit;
        cursor: pointer;
        user-select: none;
        -webkit-touch-callout: none;
      }

      .math-option[aria-checked="true"] {
        border-color: #dc2626;
        background: #fff7f7;
      }

      .math-option:focus-visible,
      .math-options-toggle:focus-visible,
      .math-options-selected button:focus-visible {
        outline: 2px solid #dc2626;
        outline-offset: -2px;
      }

      .math-option-icon--fraction {
        font-size: 0.9375rem;
        font-weight: 600;
      }

      .math-option-icon--carry-borrow {
        position: relative;
        display: block;
        width: 0.85rem;
        height: 0.6rem;
        border: 1.5px solid currentcolor;
        border-radius: 1px;
      }

      .math-option-icon--carry-borrow::after {
        position: absolute;
        top: 100%;
        left: 50%;
        width: 35%;
        height: 0.2rem;
        transform: translateX(-50%);
        border: 1.5px solid currentcolor;
        border-top: 0;
        border-radius: 0 0 1px 1px;
        content: "";
      }

      .math-option-description {
        position: absolute;
        z-index: 1;
        top: calc(100% + 0.375rem);
        left: 50%;
        display: none;
        padding: 0.25rem 0.5rem;
        transform: translateX(-50%);
        border-radius: 0.375rem;
        background: #1e293b;
        color: #fff;
        font-size: 0.75rem;
        white-space: nowrap;
        pointer-events: none;
      }

      .math-option[data-show-description="true"] .math-option-description {
        display: block;
      }

      .app-status {
        flex: 1;
        color: #64748b;
        font-size: 0.8125rem;
      }

      .clear-button {
        display: grid;
        width: 2.25rem;
        height: 2.25rem;
        flex: 0 0 auto;
        place-items: center;
        padding: 0.45rem;
        border: 1px solid #e1e7ed;
        border-radius: 0.625rem;
        background: #fff;
        color: #64748b;
        cursor: pointer;
      }

      .clear-button:hover {
        border-color: #fca5a5;
        background: #fef2f2;
        color: #b91c1c;
      }

      .clear-button:focus-visible {
        outline: 2px solid #dc2626;
        outline-offset: 2px;
      }

      .clear-button svg {
        width: 1.25rem;
        height: 1.25rem;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.75;
      }

      .workspace {
        display: flex;
        width: min(100%, 76rem);
        flex: 1;
        flex-direction: column;
        min-height: 0;
        gap: 0.625rem;
        align-self: center;
        padding-top: 0.75rem;
      }

      .worksheet-panel {
        min-width: 0;
        overflow: hidden;
        border: 1px solid #e1e7ed;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 0.5rem 1.5rem rgb(31 41 55 / 5%);
      }

      .worksheet-panel {
        display: flex;
        flex: 1;
        flex-direction: column;
        padding: clamp(1rem, 3vw, 1.5rem);
      }

      .worksheet-grid {
        display: grid;
        grid-template-columns: repeat(8, 1cm);
        grid-auto-rows: 1cm;
        flex: 1;
        min-height: 0;
        overflow: auto;
        border: 1px solid #d6dee7;
        border-radius: 0.75rem;
        background: #d6dee7;
        gap: 1px;
        overscroll-behavior: contain;
        position: relative;
        isolation: isolate;
      }

      .selection-splat {
        position: absolute;
        z-index: 5;
        top: 0;
        left: 0;
        display: none;
        overflow: hidden;
        pointer-events: none;
      }

      .worksheet-grid[data-selecting] .selection-splat {
        display: block;
      }

      .selection-splat-dim {
        fill: rgb(100 116 139 / 45%);
      }

      .selection-splat-outline {
        fill: none;
        stroke: #3b8ee8;
        stroke-width: 3;
        stroke-linejoin: round;
      }

      .carry-editor {
        position: absolute;
        z-index: 6;
        display: none;
        gap: 2px;
        padding: 2px;
        border: 0;
        border-radius: 0.375rem;
        background: transparent;
        color: #374151;
        font: inherit;
        font-size: 0.875rem;
        cursor: pointer;
      }

      .worksheet-grid[data-selecting] .carry-editor:not([hidden]) {
        display: flex;
      }

      .carry-slot {
        display: grid;
        flex: 1;
        place-items: center;
        border: 2px solid #3b8ee8;
        border-radius: 0.25rem;
        background: rgb(255 255 255 / 70%);
      }

      .carry-slot:empty {
        border-style: dashed;
      }

      .worksheet-grid[data-carry-entry] .carry-editor {
        outline: 2px solid #dc2626;
        outline-offset: 1px;
      }

      .worksheet-grid[data-carry-entry] .carry-slot {
        background: #fff;
      }

      .worksheet-cell {
        display: grid;
        position: relative;
        z-index: 0;
        min-width: 0;
        place-items: center;
        padding: 0.5rem;
        border: 0;
        background: #fff;
        color: #263548;
        font: inherit;
        text-align: center;
      }

      .worksheet-cell[data-has-border="true"],
      .worksheet-cell[data-hover-edge] {
        z-index: 2;
      }

      .cell-border {
        position: absolute;
        z-index: 2;
        display: none;
        background: #111;
        pointer-events: none;
      }

      .cell-border--top,
      .cell-border--bottom {
        right: -1px;
        left: -1px;
        height: 3px;
      }

      .cell-border--top {
        top: -1px;
      }

      .cell-border--bottom {
        bottom: -1px;
      }

      .cell-border--right,
      .cell-border--left {
        top: -1px;
        bottom: -1px;
        width: 3px;
      }

      .cell-border--right {
        right: -1px;
      }

      .cell-border--left {
        left: -1px;
      }

      .worksheet-cell[data-border-top="true"] .cell-border--top,
      .worksheet-cell[data-border-right="true"] .cell-border--right,
      .worksheet-cell[data-border-bottom="true"] .cell-border--bottom,
      .worksheet-cell[data-border-left="true"] .cell-border--left {
        display: block;
      }

      .worksheet-cell[data-hover-edge="top"] .cell-border--top,
      .worksheet-cell[data-hover-edge="right"] .cell-border--right,
      .worksheet-cell[data-hover-edge="bottom"] .cell-border--bottom,
      .worksheet-cell[data-hover-edge="left"] .cell-border--left {
        display: block;
        background: #2563eb;
      }

      .worksheet-cell-value {
        position: relative;
        z-index: 1;
        font-size: 1.15rem;
      }

      .cell-decimal {
        position: absolute;
        z-index: 2;
        right: 11px;
        bottom: 14px;
        display: none;
        width: 4px;
        height: 4px;
        transform: translate(50%, 50%);
        border: 1px solid #111;
        border-radius: 50%;
        background: transparent;
        pointer-events: none;
      }

      .cell-carry {
        position: absolute;
        z-index: 3;
        top: 0;
        left: 50%;
        padding: 0 0.15rem;
        transform: translate(-50%, -50%);
        border-radius: 0.2rem;
        background: rgb(255 255 255 / 70%);
        color: #374151;
        font-size: 0.6875rem;
        line-height: 1.2;
      }

      .cell-carry:empty {
        display: none;
      }

      .worksheet-grid:not([data-carry-enabled]) .cell-carry {
        display: none;
      }

      .worksheet-grid[data-carry-entry]
        .worksheet-cell[aria-pressed="true"]
        .cell-carry {
        display: none;
      }

      .worksheet-cell[data-hover-decimal="true"] .cell-decimal {
        display: block;
        width: 10px;
        height: 10px;
      }

      .worksheet-cell[data-decimal="true"] .cell-decimal {
        display: block;
        width: 4px;
        height: 4px;
        border: 0;
        background: #111;
      }

      .worksheet-cell[aria-pressed="true"] {
        z-index: 1;
        outline: 2px solid #dc2626;
        outline-offset: -2px;
        background: #fff7f7;
      }

      .worksheet-cell:focus-visible {
        z-index: 2;
        outline: 2px solid #dc2626;
        outline-offset: -2px;
      }

      .worksheet-cell {
        cursor: pointer;
      }

      @media (max-width: 640px) {
        .app-shell {
          padding: max(0.5rem, env(safe-area-inset-top))
            max(0.5rem, env(safe-area-inset-right))
            max(0.5rem, env(safe-area-inset-bottom))
            max(0.5rem, env(safe-area-inset-left));
        }

        .app-header {
          min-height: 2.75rem;
        }

        .workspace {
          padding-top: 0.5rem;
        }

        .worksheet-panel {
          flex: 1;
          padding: 0.875rem;
        }
      }

      @media (max-width: 360px) {
        .app-status {
          font-size: 0.6875rem;
        }
      }
    </style>
    <link rel="stylesheet" href="./keyboard.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <noscript>
      This worksheet needs JavaScript enabled to display its layout.
    </noscript>
  </body>
</html>
