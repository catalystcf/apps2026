<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A phone-friendly math worksheet with a virtual number keyboard."
    />
    <meta name="theme-color" content="#f4f6f8" />
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #1e293b;
        background: #f4f6f8;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
      }

      .app-shell {
        display: flex;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        flex-direction: column;
        overflow: hidden;
        padding: max(0.75rem, env(safe-area-inset-top))
          max(0.75rem, env(safe-area-inset-right))
          max(0.75rem, env(safe-area-inset-bottom))
          max(0.75rem, env(safe-area-inset-left));
      }

      .app-header {
        display: flex;
        min-height: 3.25rem;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding-inline: 0.25rem;
      }

      .app-title {
        margin: 0;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: -0.025em;
      }

      .app-status {
        color: #64748b;
        font-size: 0.8125rem;
      }

      .workspace {
        display: flex;
        width: min(100%, 76rem);
        flex: 1;
        flex-direction: column;
        min-height: 0;
        gap: 0.625rem;
        align-self: center;
        padding-top: 0.75rem;
      }

      .worksheet-panel,
      .keyboard-panel {
        min-width: 0;
        overflow: hidden;
        border: 1px solid #e1e7ed;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 0.5rem 1.5rem rgb(31 41 55 / 5%);
      }

      .worksheet-panel {
        display: flex;
        flex: 1;
        flex-direction: column;
        padding: clamp(1rem, 3vw, 1.5rem);
      }

      .worksheet-grid {
        display: grid;
        grid-template-columns: repeat(8, minmax(2.5rem, 1fr));
        grid-auto-rows: 2.25rem;
        flex: 1;
        min-height: 0;
        overflow: auto;
        border: 1px solid #d6dee7;
        border-radius: 0.75rem;
        background: #d6dee7;
        gap: 1px;
        overscroll-behavior: contain;
      }

      .worksheet-cell {
        display: grid;
        position: relative;
        z-index: 0;
        min-width: 0;
        place-items: center end;
        padding: 0.5rem;
        border: 0;
        background: #fff;
        color: #263548;
        font: inherit;
        text-align: right;
      }

      .worksheet-cell[data-has-border="true"],
      .worksheet-cell[data-hover-edge] {
        z-index: 2;
      }

      .cell-border {
        position: absolute;
        z-index: 2;
        display: none;
        background: #111;
        pointer-events: none;
      }

      .cell-border--top,
      .cell-border--bottom {
        right: -1px;
        left: -1px;
        height: 3px;
      }

      .cell-border--top {
        top: -1px;
      }

      .cell-border--bottom {
        bottom: -1px;
      }

      .cell-border--right,
      .cell-border--left {
        top: -1px;
        bottom: -1px;
        width: 3px;
      }

      .cell-border--right {
        right: -1px;
      }

      .cell-border--left {
        left: -1px;
      }

      .worksheet-cell[data-border-top="true"] .cell-border--top,
      .worksheet-cell[data-border-right="true"] .cell-border--right,
      .worksheet-cell[data-border-bottom="true"] .cell-border--bottom,
      .worksheet-cell[data-border-left="true"] .cell-border--left {
        display: block;
      }

      .worksheet-cell[data-hover-edge="top"] .cell-border--top,
      .worksheet-cell[data-hover-edge="right"] .cell-border--right,
      .worksheet-cell[data-hover-edge="bottom"] .cell-border--bottom,
      .worksheet-cell[data-hover-edge="left"] .cell-border--left {
        display: block;
        background: #2563eb;
      }

      .worksheet-cell-value {
        position: relative;
        z-index: 1;
      }

      .worksheet-cell[aria-pressed="true"] {
        z-index: 1;
        outline: 2px solid #dc2626;
        outline-offset: -2px;
        background: #fff7f7;
      }

      .worksheet-cell:focus-visible,
      .key:focus-visible {
        z-index: 2;
        outline: 2px solid #dc2626;
        outline-offset: -2px;
      }

      .worksheet-cell,
      .key {
        cursor: pointer;
      }

      .keypad {
        display: grid;
        flex: 1;
        min-height: 0;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-template-rows: repeat(5, minmax(0, 1fr));
        gap: clamp(0.25rem, 1vw, 0.5rem);
      }

      .keyboard-panel {
        display: flex;
        width: 100%;
        height: min(33dvh, 16rem);
        max-height: 33dvh;
        flex: 0 0 min(33dvh, 16rem);
        flex-direction: column;
        padding: clamp(0.35rem, 1.5vw, 0.75rem);
      }

      .key {
        display: grid;
        min-width: 0;
        place-items: center;
        border: 1px solid #e1e7ed;
        border-radius: 0.75rem;
        background: #f8fafc;
        color: #263548;
        font-size: clamp(1.125rem, 3vw, 1.5rem);
        font-weight: 550;
        font-family: inherit;
        user-select: none;
      }

      .key:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .key--operator {
        border-color: #d8e6df;
        background: #eff6f2;
        color: #276447;
      }

      .key--equals {
        border-color: #286646;
        background: #286646;
        color: #fff;
      }

      .key--zero {
        grid-column: span 2;
      }

      .key--action {
        grid-column: span 4;
        font-size: clamp(0.875rem, 2.5vw, 1rem);
      }

      @media (max-width: 640px) {
        .app-shell {
          padding: max(0.5rem, env(safe-area-inset-top))
            max(0.5rem, env(safe-area-inset-right))
            max(0.5rem, env(safe-area-inset-bottom))
            max(0.5rem, env(safe-area-inset-left));
        }

        .app-header {
          min-height: 2.75rem;
        }

        .workspace {
          padding-top: 0.5rem;
        }

        .worksheet-panel {
          flex: 1;
          padding: 0.875rem;
        }

        .worksheet-grid {
          grid-template-columns: repeat(8, minmax(2rem, 1fr));
          grid-auto-rows: 1.875rem;
        }

        .keyboard-panel {
          padding: 0.4rem;
        }

        .keypad {
          gap: 0.3rem;
        }
      }

      @media (max-width: 360px) {
        .app-status {
          font-size: 0.6875rem;
        }

        .keypad {
          gap: 0.3rem;
        }
      }
    </style>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <noscript>
      This worksheet needs JavaScript enabled to display its layout.
    </noscript>
  </body>
</html>
