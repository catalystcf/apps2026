<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keyboard demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #1e293b;
        background: #f4f6f8;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
      }

      /* Mirrors the app shell so the keyboard gets the same width and height. */
      .demo-shell {
        display: flex;
        height: 100vh;
        height: 100dvh;
        flex-direction: column;
        gap: 0.625rem;
        padding: 0.75rem;
      }

      .demo-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
        font-size: 0.875rem;
      }

      .demo-log {
        flex: 1;
        min-height: 0;
        overflow: auto;
        margin: 0;
        padding: 0.5rem 0.75rem;
        border: 1px solid #e1e7ed;
        border-radius: 0.75rem;
        background: #fff;
        color: #64748b;
        font-size: 0.8125rem;
      }

      @media (max-width: 640px) {
        .demo-shell {
          padding: 0.5rem;
        }
      }
    </style>
    <link rel="stylesheet" href="./keyboard.css" />
    <script type="module">
      import { createKeyboard } from "./keyboard.js";

      // ?enabled=0 shows the keys as they look before a cell is selected;
      // ?handwriting=1 opens the handwriting pad.
      const params = new URLSearchParams(location.search);
      const enabledInput = document.querySelector("#enabled");
      const log = document.querySelector(".demo-log");

      function logPress(text) {
        const line = document.createElement("div");
        line.textContent = text;
        log.prepend(line);
      }

      const keyboard = createKeyboard({
        onKey: (keyDefinition) => {
          logPress(`onKey ${JSON.stringify(keyDefinition)}`);
        },
        onClearDrawing: () => {
          logPress("onClearDrawing");
        },
      });

      const canvas = document.createElement("canvas");
      canvas.className = "handwriting-canvas";
      keyboard.handwritingPanel.append(canvas);

      enabledInput.checked = params.get("enabled") !== "0";
      keyboard.setEnabled(enabledInput.checked);
      keyboard.setHandwritingMode(params.get("handwriting") === "1");
      enabledInput.addEventListener("change", () => {
        keyboard.setEnabled(enabledInput.checked);
      });

      document.querySelector(".demo-shell").append(keyboard.element);
    </script>
  </head>
  <body>
    <main class="demo-shell">
      <div class="demo-controls">
        <strong>Keyboard demo</strong>
        <label><input id="enabled" type="checkbox" /> Keys enabled</label>
      </div>
      <pre class="demo-log" aria-live="polite"></pre>
    </main>
  </body>
</html>
